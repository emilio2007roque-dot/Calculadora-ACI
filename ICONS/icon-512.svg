<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="drum512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="orange512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg512)" />

  <!-- Inner subtle grid lines -->
  <circle cx="256" cy="256" r="210" stroke="rgba(255,255,255,0.15)" stroke-width="4" fill="none" />
  <circle cx="256" cy="256" r="160" stroke="rgba(255,255,255,0.08)" stroke-width="3" stroke-dasharray="8 8" fill="none" />

  <!-- Mixer Drum Assembly -->
  <g transform="translate(256, 235)" filter="url(#shadow)">
    <!-- Base stand -->
    <path d="M -110,140 L 110,140 M -80,140 L -40,65 M 80,140 L 40,65" stroke="#e2e8f0" stroke-width="14" stroke-linecap="round" />
    
    <!-- Drum body -->
    <path d="M -100,45 L -120,-35 L -60,-100 L 60,-100 L 120,-35 L 100,45 Z" fill="url(#drum512)" stroke="#0f172a" stroke-width="8" stroke-linejoin="round" />
    
    <!-- Stripe -->
    <path d="M -115,-15 L 115,-15 L 105,18 L -105,18 Z" fill="url(#orange512)" />
    
    <!-- Drum opening -->
    <ellipse cx="0" cy="-100" rx="60" ry="22" fill="#0284c7" stroke="#0f172a" stroke-width="7" />
    <ellipse cx="0" cy="-100" rx="42" ry="12" fill="#0f172a" />
    
    <!-- Pebbles / aggregate particles -->
    <circle cx="-50" cy="20" r="10" fill="#64748b" />
    <circle cx="0" cy="30" r="13" fill="#475569" />
    <circle cx="50" cy="18" r="10" fill="#64748b" />
    <circle cx="-25" cy="-55" r="9" fill="#cbd5e1" opacity="0.9" />
    <circle cx="30" cy="-50" r="9" fill="#cbd5e1" opacity="0.9" />
  </g>

  <!-- ACI Badge -->
  <rect x="136" y="380" width="240" height="72" rx="36" fill="#0f172a" stroke="#f59e0b" stroke-width="5" />
  <text x="256" y="428" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="3">ACI 211.1</text>
</svg>
